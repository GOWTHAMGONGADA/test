<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Computer Vision Lab Record">
  <title>Computer Vision Lab Record</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; overflow: hidden;
      background: #202124; color: #f1f3f4;
      font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      min-height: 54px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; padding: 0 18px;
      background: #17181a; border-bottom: 1px solid #3b3d40;
    }
    header strong { font-size: 15px; font-weight: 600; }
    header a {
      color: #fff; text-decoration: none; background: #3b70d6;
      padding: 8px 12px; border-radius: 6px; white-space: nowrap;
    }
    main { flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #525659; }
    @media (max-width: 520px) {
      header { padding: 0 10px; }
      header strong { font-size: 13px; }
      header a { padding: 7px 9px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <strong>Computer Vision Lab Record</strong>
    <a href="lab-record.pdf" target="_blank" rel="noopener">Open / Download PDF</a>
  </header>
  <main>
    <iframe src="lab-record.pdf#view=FitH" title="Computer Vision Lab Record PDF">
      Your browser cannot display PDFs inline.
      <a href="lab-record.pdf">Open the PDF</a>.
    </iframe>
  </main>
</body>
</html>
